name: Build KAG Music2Video APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Décompresser le projet
        run: unzip -o KAG_Music2Video_PHONE_BUILD.zip -d project

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Construire l'APK
        working-directory: project/KAG_Music2Video_Android
        run: gradle assembleDebug --stacktrace

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: KAG-Music2Video-APK
          path: project/KAG_Music2Video_Android/app/build/outputs/apk/debug/*.apk
